<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Children's Universe</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500&display=swap">
    <style>
        body {
            font-family: 'Baloo 2', cursive;
            background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('./images/bg_male1.png');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            padding: 10px 8% 0;
            box-sizing: border-box;
            position: relative;
            background-attachment: fixed;
        }

        body.female {
            background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('./images/bg_female1.png');
        }

        .container1 {
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-bottom: 20px;
            height: auto;
            width: 1200px;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .container1 h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            margin-top: 10px;
            color: #333;
            text-align: center;
        }

        .container1 p {
            font-size: 1rem;
            margin-bottom: 15px;
            text-align: center;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #ecf0f1;
            margin: 0 auto 20px;
            display: block;
            animation: bg 3s infinite;
        }

        @keyframes bg {
            100% {
                filter: hue-rotate(360deg);
            }
        }

        .container2 {
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
            height: 500px;
            width: 1200px;
            max-width: 100%;
            position: relative;
            overflow: hidden;
        }

        .carousel-title {
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-family: 'Baloo 2', cursive;
            text-align: center;
            color: white;
            font-size: 1.5rem;
        }

        .games-carousel {
            background-color: #2ecc71;
        }

        .stories-carousel {
            background-color: #e74c3c;
        }

        .activities-carousel {
            background-color: #3498db;
        }

        .carousel-item {
            text-align: center;
            padding: 20px;
            border-radius: 10px;
            height: auto;
            color: #333;
            transition: transform 0.5s ease-in-out;
            cursor: pointer;
        }

        .carousel-item:hover {
            transform: scale(1.05);
        }

        .carousel-item img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
            transition: filter 0.5s ease-in-out;
        }

        .carousel-item:hover img {
            filter: none;
        }

        .carousel-item h5 {
            background-color: rgba(255, 253, 208, 0.8);
            padding: 10px;
            border-radius: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
            color: #333;
        }

        .carousel-control-prev,
        .carousel-control-next {
            background-color: transparent;
            border: none;
            border-radius: 50%;
            filter: invert(1) drop-shadow(0 0 5px rgba(255, 255, 255, 0.7));
            width: 40px;
            height: 40px;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.3s ease-in-out;
        }

        .carousel-control-prev:hover,
        .carousel-control-next:hover {
            filter: invert(1) drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2rem;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
        }

        @media screen and (max-width: 768px) {
            .container1, .container2 {
                width: 100%;
                height: auto;
            }

            .carousel-item img {
                height: 250px;
            }
        }
    </style>
</head>
<body id="mainBody">
    <div class="container1 text-center" id="welcomeContainer">
        <h1 class="display-4 mb-4">Welcome, <span id="childName">Loading...</span>!</h1>
        <img id="childPhoto" src="images/default-child.png" alt="Child Photo" class="img-fluid profile-image rounded-circle shadow mb-3">
        <p class="lead">Get ready for fun and learning!</p>
    </div>

    <div class="container2" id="contentContainer">
        <div class="loading" id="loadingSpinner">
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
            <p>Loading your content...</p>
        </div>

        <div class="row" id="contentRow" style="display: none;">
            <div class="col-md-4">
                <h2 class="carousel-title stories-carousel">Stories <i class="fas fa-book"></i></h2>
                <div id="storyCarousel" class="carousel slide" data-ride="carousel">
                    <div class="carousel-inner" id="storyCarouselInner">
                        <!-- Stories will be loaded here -->
                    </div>
                    <a class="carousel-control-prev" href="#storyCarousel" role="button" data-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="sr-only">Previous</span>
                    </a>
                    <a class="carousel-control-next" href="#storyCarousel" role="button" data-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="sr-only">Next</span>
                    </a>
                </div>
            </div>

            <div class="col-md-4">
                <h2 class="carousel-title games-carousel">Games <i class="fas fa-gamepad"></i></h2>
                <div id="gameCarousel" class="carousel slide" data-ride="carousel">
                    <div class="carousel-inner" id="gameCarouselInner">
                        <!-- Games will be loaded here -->
                    </div>
                    <a class="carousel-control-prev" href="#gameCarousel" role="button" data-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="sr-only">Previous</span>
                    </a>
                    <a class="carousel-control-next" href="#gameCarousel" role="button" data-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="sr-only">Next</span>
                    </a>
                </div>
            </div>

            <div class="col-md-4">
                <h2 class="carousel-title activities-carousel">Activities <i class="fas fa-cubes"></i></h2>
                <div id="activityCarousel" class="carousel slide" data-ride="carousel">
                    <div class="carousel-inner" id="activityCarouselInner">
                        <!-- Activities will be loaded here -->
                    </div>
                    <a class="carousel-control-prev" href="#activityCarousel" role="button" data-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="sr-only">Previous</span>
                    </a>
                    <a class="carousel-control-next" href="#activityCarousel" role="button" data-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="sr-only">Next</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    <script>
        let selectedKidId = null;
        let selectedKidData = null;

        $(document).ready(function() {
            // Get kidId from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            selectedKidId = urlParams.get('kidId');

            if (!selectedKidId) {
                // Redirect to login if no kidId
                window.location.href = 'login_new.html';
                return;
            }

            // Load child data and content
            loadChildData();
        });

        function loadChildData() {
            // Get child data from API
            $.ajax({
                url: `/api/children/get.php?kid_id=${selectedKidId}`,
                method: 'GET',
                success: function(response) {
                    if (response.success && response.child) {
                        selectedKidData = response.child;
                        updateUI();
                        loadContent();
                    } else {
                        showError('Child not found');
                    }
                },
                error: function() {
                    showError('Failed to load child data');
                }
            });
        }

        function updateUI() {
            // Update child name and photo
            $('#childName').text(selectedKidData.kid_name);
            $('#childPhoto').attr('src', selectedKidData.kid_photo || 'images/default-child.png');
            
            // Set body class based on gender
            if (selectedKidData.kid_gender === 'female') {
                $('#mainBody').addClass('female');
            }
        }

        function loadContent() {
            // Load stories, games, and activities in parallel
            const promises = [
                loadStories(),
                loadGames(),
                loadActivities()
            ];

            Promise.all(promises).then(() => {
                $('#loadingSpinner').hide();
                $('#contentRow').show();
                initializeCarousels();
            }).catch((error) => {
                console.error('Error loading content:', error);
                showError('Failed to load content');
            });
        }

        function loadStories() {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: `/api/content/stories.php?kid_id=${selectedKidId}&limit=5`,
                    method: 'GET',
                    success: function(response) {
                        if (response.success) {
                            renderCarouselItems('storyCarouselInner', response.stories, 'story');
                        }
                        resolve();
                    },
                    error: function() {
                        renderEmptyCarousel('storyCarouselInner', 'No stories available');
                        resolve();
                    }
                });
            });
        }

        function loadGames() {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: `/api/content/games.php?kid_id=${selectedKidId}&limit=5`,
                    method: 'GET',
                    success: function(response) {
                        if (response.success) {
                            renderCarouselItems('gameCarouselInner', response.games, 'game');
                        }
                        resolve();
                    },
                    error: function() {
                        renderEmptyCarousel('gameCarouselInner', 'No games available');
                        resolve();
                    }
                });
            });
        }

        function loadActivities() {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: `/api/content/activities.php?kid_id=${selectedKidId}&limit=5`,
                    method: 'GET',
                    success: function(response) {
                        if (response.success) {
                            renderCarouselItems('activityCarouselInner', response.activities, 'activity');
                        }
                        resolve();
                    },
                    error: function() {
                        renderEmptyCarousel('activityCarouselInner', 'No activities available');
                        resolve();
                    }
                });
            });
        }

        function renderCarouselItems(containerId, items, type) {
            const container = $(`#${containerId}`);
            container.empty();

            if (items.length === 0) {
                renderEmptyCarousel(containerId, `No ${type}s available`);
                return;
            }

            items.forEach((item, index) => {
                const activeClass = index === 0 ? 'active' : '';
                const itemHtml = `
                    <div class="carousel-item ${activeClass}" data-${type}-id="${item.id}">
                        <img src="${item.photo}" class="d-block w-100" alt="${item[`${type}_title`] || item.title}">
                        <div class="carousel-caption d-none d-md-block mb-2">
                            <h5>${item[`${type}_title`] || item.title}</h5>
                        </div>
                    </div>
                `;
                container.append(itemHtml);
            });
        }

        function renderEmptyCarousel(containerId, message) {
            const container = $(`#${containerId}`);
            container.html(`
                <div class="carousel-item active">
                    <img src="images/hidden.png" class="d-block w-100" alt="No content">
                    <div class="carousel-caption d-none d-md-block mb-2">
                        <h5>${message}</h5>
                    </div>
                </div>
            `);
        }

        function initializeCarousels() {
            // Initialize all carousels
            $('#storyCarousel').carousel();
            $('#gameCarousel').carousel();
            $('#activityCarousel').carousel();

            // Add click handlers
            $('#storyCarousel .carousel-item').click(function() {
                const storyId = $(this).data('story-id');
                if (storyId) {
                    window.location.href = `watch_story.html?story_id=${storyId}&kid_id=${selectedKidId}`;
                }
            });

            $('#gameCarousel .carousel-item').click(function() {
                const gameId = $(this).data('game-id');
                if (gameId) {
                    window.location.href = `play_game.html?game_id=${gameId}&kid_id=${selectedKidId}`;
                }
            });

            $('#activityCarousel .carousel-item').click(function() {
                const activityId = $(this).data('activity-id');
                if (activityId) {
                    window.location.href = `view_activity.html?activity_id=${activityId}&kid_id=${selectedKidId}`;
                }
            });
        }

        function showError(message) {
            $('#loadingSpinner').html(`
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle"></i> ${message}
                </div>
            `);
        }
    </script>
</body>
</html>
