<body>
    <!-- Check if user is already logged in and redirect to login.php -->
    <script>
        (function() {
            // Check if this page was redirected from login.php to prevent loop
            const urlParams = new URLSearchParams(window.location.search);
            const fromLoginPhp = urlParams.get('from_login_php');
            
            // If we came from login.php, don't redirect back to avoid loop
            if (fromLoginPhp === '1') {
                console.log('Came from login.php, staying on login.html to prevent redirect loop');
                return;
            }
            
            // Check localStorage for login status
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const userId = localStorage.getItem('userId');
            
            // If user is logged in, redirect to login.php with flag
            if (isLoggedIn === 'true' && userId) {
                window.location.href = 'login.php?from_login_html=1';
            }
        })();
    </script>

    <div class="container">
        <div class="row">

                <!-- Formulaire de Connexion -->
                <div class="card" id="loginForm">
                    <div class="card-body">
                        <h5 class="card-title text-center">Connexion</h5>
                        <form method="post" action="login.php">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="loginEmail" name="loginEmail"

                            </div>
                            <div class="mb-3">

                            </div>
                            <div class="mb-3">

                        </form>

                            <div class="mb-3">

                                    placeholder="Mot de passe" required>
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                                    placeholder="Confirmer le mot de passe" required>
                            </div>
                            <div class="mb-3 form-check">

                            <!-- Options supplémentaires pour les parents -->

    <!-- JavaScript -->
<script>
    $(document).ready(function () {
        $(".toggle-form").click(function (event) {
            event.preventDefault();
            if ($("#loginForm").is(":visible")) {
                $("#loginForm").slideUp(400, function () {
                    $("#signupForm").slideDown(400);
                });
            } else {
                $("#signupForm").slideUp(400, function () {
                    $("#loginForm").slideDown(400);
                });
            }
        });

        // Afficher/Masquer les options supplémentaires pour les parents en fonction de la case à cocher
        $("#parentCheckbox").change(function () {
            if ($(this).is(":checked")) {
                $("#parentOptions").slideDown(400);
            } else {
                $("#parentOptions").slideUp(400);
            }
        });

        // Demo login button for portfolio
        $("#demoLoginBtn").click(function() {
            $("#loginEmail").val("test@ww.com");
            $("#loginPassword").val("test@ww.com");
            // Auto-submit the form
            $("form[action='login.php']").submit();
        });

        // Admin login button
        $("#adminLoginBtn").click(function() {
            $("#loginEmail").val("admin@childrenuniverse.com");
            $("#loginPassword").val("admin123");
            // Auto-submit the form
            $("form[action='login.php']").submit();
        });

        // Générer dynamiquement des champs de saisie pour les informations sur les enfants
        $("#numberOfKids").on("input", function () {
            var numberOfKids = $(this).val();
            var kidsInformation = $("#kidsInformation");

            // Effacer les champs d'informations existants sur les enfants
            kidsInformation.empty();

            // Générer des champs de saisie pour chaque enfant
            for (var i = 1; i <= numberOfKids; i++) {
                kidsInformation.append(
                    `<h6>Information sur l'enfant ${i}</h6>
                    <div class="mb-3">
                        <label for="kidGender${i}" class="form-label">Genre de l'enfant ${i}</label>
                        <select class="form-select border-6 rounded-6" id="kidGender${i}" name="kidGender${i}" required onchange="changeBorderColor(${i})">
                            <option value="" selected disabled>Choisissez le genre</option>
                            <option value="male">Masculin</option>
                            <option value="female">Féminin</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="kidName${i}" class="form-label">Nom de l'enfant ${i}</label>
                        <input type="text" class="form-control" id="kidName${i}" name="kidName${i}" placeholder="Nom de l'enfant ${i}">
                    </div>
                    <div class="mb-3">
                        <label for="kidAge${i}" class="form-label">Âge de l'enfant ${i}</label>
                        <input type="number" class="form-control" id="kidAge${i}" name="kidAge${i}" max="6" min="3" placeholder="Âge de l'enfant ${i}">
                    </div>
                    <div class="mb-3">
                        <label for="kidPhoto${i}" class="form-label">Photo de l'enfant ${i}</label>
                        <input type="file" class="form-control" id="kidPhoto${i}" name="kidPhoto${i}" accept="image/*">
                    </div>`
                );
            }
        });

        // Function to change border color based on gender selection
        function changeBorderColor(kidNumber) {
            var selectedGender = $(`#kidGender${kidNumber}`).val();
            var borderColor = (selectedGender === 'female') ? 'pink' : 'blue';
            $(`#kidGender${kidNumber}`).css('border-color', borderColor);
        }
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Check if the email parameter is present in the URL
        var emailParameter = new URLSearchParams(window.location.search).get('email');
        if (emailParameter) {
            // Set the email value in the signup form
            document.getElementById("signupEmail").value = decodeURIComponent(emailParameter);

            // Show the signup form
            $("#loginForm").slideUp(400, function () {
                $("#signupForm").slideDown(400);
            });
        }
    });
</script>
