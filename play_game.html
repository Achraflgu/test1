<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game - Children's Universe</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            margin: 0 auto;
        }
        .game-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 1rem;
        }
        .btn-back {
            background-color: #4f0c3f;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 1rem;
        }
        .btn-back:hover {
            background-color: #3a0a2f;
            color: white;
            text-decoration: none;
        }
        .game-frame {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 10px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <a href="acceuil_new.html" class="btn-back">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
        
        <div id="gameContent">
            <div class="text-center">
                <div class="spinner-border" role="status">
                    <span class="sr-only">Loading...</span>
                </div>
                <p>Loading game...</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            const urlParams = new URLSearchParams(window.location.search);
            const gameId = urlParams.get('game_id');
            const kidId = urlParams.get('kid_id');

            if (!gameId) {
                $('#gameContent').html('<div class="alert alert-danger">Game ID not provided</div>');
                return;
            }

            // Load game details
            $.ajax({
                url: '/api/content/games',
                method: 'GET',
                data: { kid_id: kidId, limit: 100 },
                success: function(response) {
                    if (response.success) {
                        const game = response.games.find(g => g.id == gameId);
                        if (game) {
                            displayGame(game);
                        } else {
                            $('#gameContent').html('<div class="alert alert-warning">Game not found</div>');
                        }
                    } else {
                        $('#gameContent').html('<div class="alert alert-danger">Failed to load game</div>');
                    }
                },
                error: function() {
                    $('#gameContent').html('<div class="alert alert-danger">Error loading game</div>');
                }
            });
        });

        function displayGame(game) {
            const html = `
                <img src="${game.photo}" alt="${game.game_title}" class="game-image">
                <h1>${game.game_title}</h1>
                <p class="lead">${game.description}</p>
                ${game.link_of_games ? `
                    <div class="text-center">
                        <iframe src="${game.link_of_games}" class="game-frame" allowfullscreen></iframe>
                    </div>
                ` : ''}
            `;
            $('#gameContent').html(html);
        }
    </script>
</body>
</html>
